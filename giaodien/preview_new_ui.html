function applySeason(k){const r=document.getElementById("app-root");SEASONS.forEach(s=>r.classList.remove("app-"+s.key));r.classList.add("app-"+k);const b=document.getElementById("app-season-btn");if(b)b.querySelector(".app-emoji").textContent=(SEASONS.find(s=>s.key===k)||SEASONS[0]).emoji;}
function navFor(role){
  const nav=[{route:"",label:"Hôm nay",icon:"today"},{route:"trace",label:"Truy xuất",icon:"search"},
    {route:"documents",label:role==="QA"?"Tài liệu":"Hồ sơ",icon:"folder_open"}];

  return nav;
}

      <span class="app-brand-badge">${sym("health_and_safety")}</span>
      <span class="app-brand-txt">
        <span class="app-brand-name">ATTP Hoàng Giang</span>
        <span class="app-brand-sub">An toàn thực phẩm · ISO 22000</span>

    </a>
    <div class="app-header-actions">
      <span class="app-role-chip app-role-${ROLE==="QA"?"qa":"qc"}" id="app-role-chip" title="Bấm để đổi vai trò (preview)" style="cursor:pointer">${ROLE}</span>

  <nav class="app-bottomnav">${nav.map(n=>`<a class="app-tab" data-route="${n.route}" href="#/${n.route}"><span class="app-tab-ic">${sym(n.icon)}</span><span>${n.label}</span></a>`).join("")}</nav>`;
}

function stat(label,val,tone,icon){
  const ic = icon?`<div class="app-stat-ic">${sym(icon)}</div>`:"";
  return `<div class="app-stat ${tone==="red"?"app-stat-red":""}">${ic}<div class="app-stat-val">${val}</div><div class="app-stat-label">${label}</div></div>`;
}
function dom(icon,label,n){
  return `<h3 class="app-h3"><span class="material-symbols-outlined app-h3-ic">${icon}</span>${label} <span class="app-badge">${n}</span></h3>`;
}
function task(title,freq,late,form){
  const chip = `<span class="app-chip ${late?"app-chip-red":"app-chip-gray"}">${late?"Trễ":"Chờ"}</span>`;
  const act = form?`<a class="app-btn-sm" href="#/">Ghi</a>`:`<button class="app-btn-sm">Đánh dấu đã làm</button>`;
  return `<div class="app-task"><div class="app-task-main"><div class="app-task-title">${title}</div>
    <div class="app-task-meta">${chip}<span class="app-task-freq">${freq}</span></div></div><div class="app-task-act">${act}</div></div>`;
}

function doc(name,code,ver,status,att){
  const meta=[code, ver?("v"+ver):"", status].filter(Boolean).join(" · ");
  const read=att?`<a class="app-btn-sm" onclick="event.stopPropagation()">${sym("visibility")}</a>`:"";
  const data=encodeURIComponent(JSON.stringify({name,code,ver,status,att}));
  return `<div class="app-doc app-doc-click" onclick="PVdetail('${data}')"><div class="app-doc-ic">${sym("description")}</div>
    <div class="app-doc-main"><div class="app-doc-name">${name}</div><div class="app-doc-meta">${meta}</div></div>
    <div class="app-doc-act">${read}<span class="material-symbols-outlined app-doc-chev">chevron_right</span></div></div>`;
}
function PVkv(l,v){return v?`<div class="app-kv"><span class="app-kv-l">${l}</span><span class="app-kv-v">${v}</span></div>`:"";}
function PVmodal(title,bodyHtml,wide){
  const host=document.querySelector(".app-root")||document.body;
  const ov=document.createElement("div");ov.className="app-modal-ov";
  ov.innerHTML=`<div class="app-modal${wide?" app-modal-wide":""}"><div class="app-modal-head"><span>${title}</span><button class="app-modal-x">×</button></div><div class="app-modal-body">${bodyHtml}</div></div>`;
  host.appendChild(ov);
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
  ov.querySelector(".app-modal-x").addEventListener("click",()=>ov.remove());
  return ov;
}

      <div class="app-kvlist">${PVkv("Phiên bản",d.ver?("v"+d.ver):"")}${PVkv("Nơi lưu","Ban ISO")}${PVkv("Thời gian lưu","Lâu dài")}${PVkv("Cập nhật cuối","2026-06-18 09:12")}${PVkv("Số lần cập nhật","2")}</div>

function bar(label,val,color){
  const h = Math.round(val/15*160)+10;
  return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%;">
    <div style="font-size:13px;font-weight:800;color:#0f172a;">${val}</div>
    <div style="width:100%;max-width:56px;height:${h}px;background:${color};border-radius:8px;"></div>
    <div style="font-size:12px;color:#94a3b8;font-weight:600;">${label}</div></div>`;
}

function PVseason(){
  const cur=(document.getElementById("app-root").className.match(/app-(spring|summer|autumn|winter)/)||[])[1]||"spring";
  const ov=PVmodal("Giao diện theo mùa",`<div class="app-season-grid">${SEASONS.map(s=>`<button class="app-season-opt ${s.key===cur?"app-active":""}" data-season="${s.key}"><span class="app-emoji">${s.emoji}</span><span>${s.label}</span></button>`).join("")}</div>`);
  ov.querySelectorAll("[data-season]").forEach(b=>b.addEventListener("click",()=>{applySeason(b.dataset.season);ov.remove();}));
}
function route(){
  let r = (location.hash||"#/").replace(/^#\/?/,"");
  if(r==="dashboard"&&ROLE!=="QA")r="";      // KCS không có Bảng ĐK
  const key = VIEWS[r]?r:"";
  document.getElementById("app-main").innerHTML = VIEWS[key]();
  document.querySelectorAll(".app-tab").forEach(a=>a.classList.toggle("app-active",a.getAttribute("data-route")===r));
  window.scrollTo(0,0);
}
function mountShell(){
  const cur=(document.getElementById("app-root").className.match(/app-(spring|summer|autumn|winter)/)||[])[1]||"spring";
  document.getElementById("app-root").innerHTML = shell();
  applySeason(cur);
  document.getElementById("app-season-btn").addEventListener("click",PVseason);
  document.getElementById("app-role-chip").addEventListener("click",()=>{
    ROLE = ROLE==="KCS"?"QA":"KCS"; location.hash="#/"; mountShell(); route();
  });
}
mountShell();
window.addEventListener("hashchange",route);
route();
</script>
</body>
